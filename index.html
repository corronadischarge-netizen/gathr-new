  <p class="upright-s">gathr works in portrait.</p>
  <button type="button" class="upright-skip" onclick="try{sessionStorage.setItem('gathr.sideways','ok')}catch(e){}document.documentElement.classList.remove('is-sideways')">Use it sideways anyway</button>
</div>
